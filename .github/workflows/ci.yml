name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    name: typecheck / unit / e2e (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies (frozen, from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm run typecheck

      - name: Unit tests (offline, mock)
        run: pnpm test

      - name: 20-chapter e2e regression (forced mock, no network)
        run: pnpm run test:e2e

      # 评测自检（离线：--self-check 固定 mock + keyword 裁判）
      - name: Eval self-check
        run: pnpm run eval:check
